[package]
name = "manga-syncer"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.99"
awconf = { git = "https://github.com/awused/awconf" }
base64 = "0.22.1"
clap = { version = "4.5.47", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.28"
regex = "1.11.2"
rayon = "1.11.0"
# We're mostly limited to one thread anyway
reqwest = { version = "0.12.23", features = ["blocking", "brotli", "deflate", "json", "gzip"] }
serde = { version = "1.0.225", default-features = false, features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
serde_with = "3.14.0"
tempfile = "3.22.0"
uuid = "1.18.1"
zip = { version = "5.1.1", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.0"
